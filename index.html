<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HorasPro">
    
    <title>HorasPro Elite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        :root {
            --ios-bg: #000000;
            --accent: #00e5ff;
            --danger: #ff3b30;
            --success: #34c759;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--ios-bg);
            color: #ffffff;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            user-select: none;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .card-inner {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .pt-safe { padding-top: calc(var(--safe-area-top) + 0.5rem); }
        .pb-safe { padding-bottom: calc(var(--safe-area-bottom) + 1rem); }

        input[type="time"] {
            color-scheme: dark;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            font-weight: 600;
            width: 100%;
        }

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: black;
            z-index: 10000;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { display: none; }

        .ios-btn-active:active { transform: scale(0.96); opacity: 0.8; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-cyan-500 font-bold tracking-widest text-xs uppercase">Iniciando HorasPro</p>
    </div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEY = "horas_pro_vFinal";
        const DAILY_LIMIT = 8;

        function App() {
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            });
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split("T")[0]);
            const [view, setView] = useState('day'); // day, history, settings
            const [toast, setToast] = useState(null);

            // Estados del formulario
            const [shifts, setShifts] = useState([{ start: "", end: "" }]);
            const [note, setNote] = useState("");
            const [dayOff, setDayOff] = useState(false);
            const [useAutoBreak, setUseAutoBreak] = useState(false);

            const fileInputRef = useRef(null);

            useEffect(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }, [records]);

            useEffect(() => {
                const rec = records[selectedDate] || { shifts: [], note: "", dayOff: false, useAutoBreak: false };
                setShifts(rec.shifts?.length ? rec.shifts : [{ start: "", end: "" }]);
                setNote(rec.note || "");
                setDayOff(rec.dayOff || false);
                setUseAutoBreak(rec.useAutoBreak || false);
            }, [selectedDate, records]);

            useEffect(() => {
                lucide.createIcons();
            }, [view, shifts, dayOff, records, selectedDate]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const parseTime = (str) => {
                if (!str) return null;
                const [h, m] = str.split(":").map(Number);
                return h + m / 60;
            };

            const getStats = (dateStr, data) => {
                const rec = data[dateStr];
                if (!rec || rec.dayOff) return { total: 0, regular: 0, extra: 0, dayOff: !!rec?.dayOff, hasData: !!rec };
                
                let total = (rec.shifts || []).reduce((acc, s) => {
                    let start = parseTime(s.start);
                    let end = parseTime(s.end);
                    if (start === null || end === null) return acc;
                    if (end < start) end += 24;
                    return acc + (end - start);
                }, 0);

                if (rec.useAutoBreak && total >= 6) total -= 0.5;

                const regular = Math.min(total, DAILY_LIMIT);
                const extra = Math.max(0, total - DAILY_LIMIT);
                return { total, regular, extra, dayOff: false, hasData: true };
            };

            const save = () => {
                const validShifts = shifts.filter(s => s.start && s.end);
                if (!dayOff && validShifts.length === 0) {
                    showToast("Añade algún turno o marca día libre");
                    return;
                }
                setRecords(prev => ({
                    ...prev,
                    [selectedDate]: { shifts: validShifts, note, dayOff, useAutoBreak }
                }));
                showToast("Registro guardado");
            };

            const formatH = (h) => {
                const hours = Math.floor(h);
                const mins = Math.round((h - hours) * 60);
                return `${hours}h ${mins.toString().padStart(2, '0')}m`;
            };

            const currentStats = useMemo(() => getStats(selectedDate, records), [selectedDate, records, shifts, dayOff, useAutoBreak]);

            // Backup & Restore
            const exportBackup = () => {
                const dataStr = JSON.stringify(records);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `horaspro_backup_${selectedDate}.json`;
                a.click();
                showToast("Copia de seguridad descargada");
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        setRecords(json);
                        showToast("Datos importados con éxito");
                    } catch (err) {
                        showToast("Error: archivo no válido");
                    }
                };
                reader.readAsText(file);
            };

            const exportCSV = () => {
                let csv = "Fecha,Tipo,Total,Extras,Notas\n";
                Object.keys(records).sort().forEach(d => {
                    const s = getStats(d, records);
                    csv += `${d},${s.dayOff ? 'Libre' : 'Trabajo'},${s.total.toFixed(2)},${s.extra.toFixed(2)},"${records[d].note.replace(/"/g, '""')}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'informe_horas.csv';
                a.click();
                showToast("CSV generado");
            };

            // Helpers para historial mensual
            const monthlyData = useMemo(() => {
                const months = {};
                Object.keys(records).forEach(date => {
                    const monthKey = date.substring(0, 7);
                    if (!months[monthKey]) months[monthKey] = { total: 0, extra: 0, worked: 0, off: 0 };
                    const s = getStats(date, records);
                    if (s.dayOff) months[monthKey].off++;
                    else {
                        months[monthKey].worked++;
                        months[monthKey].total += s.total;
                        months[monthKey].extra += s.extra;
                    }
                });
                return Object.entries(months).sort((a, b) => b[0].localeCompare(a[0]));
            }, [records]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header Principal */}
                    <header className="pt-safe px-6 pb-4 glass sticky top-0 z-50">
                        <div className="flex justify-between items-center mb-5">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                    <i data-lucide="clock" className="w-5 h-5 text-black"></i>
                                </div>
                                <span className="font-extrabold text-lg tracking-tight">HorasPro <span className="text-cyan-400 font-light">Elite</span></span>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={exportCSV} className="p-2 bg-white/5 rounded-full ios-btn-active">
                                    <i data-lucide="file-text" className="w-5 h-5 text-slate-400"></i>
                                </button>
                                <button onClick={() => setView('settings')} className="p-2 bg-white/5 rounded-full ios-btn-active">
                                    <i data-lucide="settings" className="w-5 h-5 text-slate-400"></i>
                                </button>
                            </div>
                        </div>

                        {view !== 'settings' && (
                            <div className="flex items-center justify-between bg-black/40 p-1.5 rounded-2xl border border-white/5">
                                <button onClick={() => {
                                    const d = new Date(selectedDate); d.setDate(d.getDate() - 1);
                                    setSelectedDate(d.toISOString().split('T')[0]);
                                }} className="p-2 ios-btn-active"><i data-lucide="chevron-left"></i></button>
                                
                                <div className="flex-1 text-center">
                                    <input 
                                        type="date" 
                                        value={selectedDate} 
                                        onChange={e => setSelectedDate(e.target.value)}
                                        className="bg-transparent font-bold outline-none text-sm text-center w-full"
                                    />
                                    <p className="text-[10px] text-cyan-500 font-black uppercase mt-0.5 tracking-tighter">
                                        {new Date(selectedDate).toLocaleDateString('es-ES', { weekday: 'long' })}
                                    </p>
                                </div>
                                
                                <button onClick={() => {
                                    const d = new Date(selectedDate); d.setDate(d.getDate() + 1);
                                    setSelectedDate(d.toISOString().split('T')[0]);
                                }} className="p-2 ios-btn-active"><i data-lucide="chevron-right"></i></button>
                            </div>
                        )}
                    </header>

                    <main className="px-4 py-6 flex-1">
                        {view === 'day' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                {/* Resumen del día */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="glass p-5 rounded-[28px] relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-cyan-500"></div>
                                        <p className="text-[10px] font-black text-slate-500 uppercase mb-1">Horas Totales</p>
                                        <p className="text-3xl font-bold mono tracking-tighter">{formatH(currentStats.total)}</p>
                                    </div>
                                    <div className="glass p-5 rounded-[28px] relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-rose-500"></div>
                                        <p className="text-[10px] font-black text-slate-500 uppercase mb-1">Extras</p>
                                        <p className="text-3xl font-bold mono text-rose-500 tracking-tighter">{formatH(currentStats.extra)}</p>
                                    </div>
                                </div>

                                {/* Formulario */}
                                <div className="glass p-6 rounded-[32px] space-y-6">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 rounded-xl ${dayOff ? 'bg-emerald-500/20' : 'bg-cyan-500/20'}`}>
                                                <i data-lucide={dayOff ? "sun" : "briefcase"} className={`w-5 h-5 ${dayOff ? 'text-emerald-500' : 'text-cyan-500'}`}></i>
                                            </div>
                                            <h3 className="font-bold">Estado del día</h3>
                                        </div>
                                        <button 
                                            onClick={() => setDayOff(!dayOff)}
                                            className={`px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${dayOff ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/30' : 'bg-white/10 text-slate-400'}`}
                                        >
                                            {dayOff ? 'LIBRE' : 'LABORAL'}
                                        </button>
                                    </div>

                                    {!dayOff && (
                                        <div className="space-y-5 pt-2">
                                            {shifts.map((s, i) => (
                                                <div key={i} className="flex items-end gap-3 group">
                                                    <div className="flex-1 space-y-1.5">
                                                        <label className="text-[10px] font-bold text-slate-500 ml-1">ENTRADA</label>
                                                        <input type="time" value={s.start} onChange={e => {
                                                            const n = [...shifts]; n[i].start = e.target.value; setShifts(n);
                                                        }} />
                                                    </div>
                                                    <div className="pb-2.5">
                                                        <i data-lucide="arrow-right-left" className="w-4 h-4 text-slate-700"></i>
                                                    </div>
                                                    <div className="flex-1 space-y-1.5">
                                                        <label className="text-[10px] font-bold text-slate-500 ml-1">SALIDA</label>
                                                        <input type="time" value={s.end} onChange={e => {
                                                            const n = [...shifts]; n[i].end = e.target.value; setShifts(n);
                                                        }} />
                                                    </div>
                                                    {shifts.length > 1 && (
                                                        <button onClick={() => setShifts(shifts.filter((_, idx) => idx !== i))} className="p-2 mb-1 text-rose-500 ios-btn-active">
                                                            <i data-lucide="minus-circle"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                            
                                            <button onClick={() => setShifts([...shifts, {start: "", end: ""}])} className="w-full py-4 rounded-2xl border-2 border-dashed border-white/10 text-xs font-bold text-slate-500 active:bg-white/5 transition-colors">
                                                + AÑADIR BLOQUE HORARIO
                                            </button>

                                            <div className="flex items-center justify-between p-4 card-inner">
                                                <div className="flex items-center gap-3">
                                                    <i data-lucide="coffee" className="w-4 h-4 text-cyan-400"></i>
                                                    <span className="text-xs font-semibold text-slate-300">Pausa automática (-30m)</span>
                                                </div>
                                                <button onClick={() => setUseAutoBreak(!useAutoBreak)} className={`w-12 h-6 rounded-full relative transition-all ${useAutoBreak ? 'bg-cyan-500' : 'bg-white/10'}`}>
                                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${useAutoBreak ? 'left-7' : 'left-1'}`} />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="glass p-6 rounded-[32px] space-y-4">
                                    <h3 className="text-[10px] font-black text-slate-500 uppercase flex items-center gap-2">
                                        <i data-lucide="align-left" className="w-4 h-4"></i> Notas del día
                                    </h3>
                                    <textarea 
                                        value={note}
                                        onChange={e => setNote(e.target.value)}
                                        placeholder="Tareas realizadas, incidencias..."
                                        className="w-full bg-black/20 rounded-2xl p-4 text-sm outline-none border border-white/5 focus:border-cyan-500/50 min-h-[100px] resize-none"
                                    />
                                </div>

                                <button onClick={save} className="w-full py-6 bg-cyan-500 text-black font-black rounded-[28px] text-lg shadow-xl shadow-cyan-500/20 ios-btn-active">
                                    GUARDAR REGISTRO
                                </button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-6 animate-in fade-in duration-500 pb-20">
                                <h2 className="text-2xl font-extrabold px-2 flex justify-between items-center">
                                    Historial
                                    <span className="text-[10px] bg-white/10 px-3 py-1 rounded-full font-black text-cyan-400 uppercase tracking-widest">
                                        {monthlyData.length} Meses
                                    </span>
                                </h2>
                                
                                {monthlyData.map(([month, data]) => (
                                    <div key={month} className="glass rounded-[32px] overflow-hidden">
                                        <div className="bg-white/5 p-5 border-b border-white/5 flex justify-between items-center">
                                            <h3 className="font-bold text-lg capitalize">{new Date(month + "-02").toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</h3>
                                            <i data-lucide="calendar" className="w-4 h-4 text-slate-600"></i>
                                        </div>
                                        <div className="p-5 space-y-4">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="card-inner p-4 text-center">
                                                    <p className="text-[9px] font-black text-slate-500 uppercase mb-1">Total Horas</p>
                                                    <p className="text-xl font-bold mono">{formatH(data.total + data.extra)}</p>
                                                </div>
                                                <div className="card-inner p-4 text-center">
                                                    <p className="text-[9px] font-black text-rose-500/60 uppercase mb-1">Extras</p>
                                                    <p className="text-xl font-bold mono text-rose-500">{formatH(data.extra)}</p>
                                                </div>
                                            </div>
                                            <div className="flex justify-between text-[11px] font-bold px-2">
                                                <span className="text-slate-500 uppercase">Trabajados: <span className="text-white">{data.worked}</span></span>
                                                <span className="text-slate-500 uppercase">Días Libres: <span className="text-emerald-500">{data.off}</span></span>
                                            </div>
                                            
                                            <div className="space-y-2 mt-4 pt-4 border-t border-white/5">
                                                {Object.keys(records).filter(d => d.startsWith(month)).sort().reverse().slice(0, 3).map(date => {
                                                    const s = getStats(date, records);
                                                    return (
                                                        <div key={date} onClick={() => { setSelectedDate(date); setView('day'); }} className="flex justify-between items-center text-xs p-2 rounded-xl active:bg-white/5">
                                                            <span className="font-medium text-slate-400">{new Date(date).toLocaleDateString('es-ES', { day: 'numeric', weekday: 'short' })}</span>
                                                            <div className="flex gap-3">
                                                                <span className="mono">{formatH(s.total)}</span>
                                                                {s.extra > 0 && <span className="text-rose-500 mono font-bold">+{formatH(s.extra)}</span>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                ))}

                                {monthlyData.length === 0 && (
                                    <div className="text-center py-20 opacity-30">
                                        <i data-lucide="calendar-x-2" className="w-16 h-16 mx-auto mb-4"></i>
                                        <p>No hay registros históricos</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="flex items-center gap-4 mb-6">
                                    <button onClick={() => setView('day')} className="p-3 bg-white/10 rounded-2xl"><i data-lucide="arrow-left"></i></button>
                                    <h2 className="text-2xl font-black">Ajustes</h2>
                                </div>

                                <section className="glass p-6 rounded-[32px] space-y-6">
                                    <h3 className="text-xs font-black text-cyan-500 uppercase tracking-widest">Copia de Seguridad</h3>
                                    
                                    <div className="space-y-4">
                                        <p className="text-sm text-slate-400 leading-relaxed">Guarda tus registros en un archivo externo o impórtalos si has cambiado de dispositivo.</p>
                                        
                                        <button onClick={exportBackup} className="w-full flex items-center justify-between p-4 card-inner ios-btn-active">
                                            <div className="flex items-center gap-3">
                                                <i data-lucide="download-cloud" className="w-5 h-5 text-cyan-400"></i>
                                                <span className="font-bold text-sm">Exportar Backup (.json)</span>
                                            </div>
                                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-600"></i>
                                        </button>

                                        <button onClick={() => fileInputRef.current?.click()} className="w-full flex items-center justify-between p-4 card-inner ios-btn-active">
                                            <div className="flex items-center gap-3">
                                                <i data-lucide="upload-cloud" className="w-5 h-5 text-emerald-400"></i>
                                                <span className="font-bold text-sm">Importar Backup</span>
                                            </div>
                                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-600"></i>
                                        </button>
                                        <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
                                    </div>
                                </section>

                                <section className="glass p-6 rounded-[32px] space-y-4">
                                    <h3 className="text-xs font-black text-rose-500 uppercase tracking-widest">Zona Peligrosa</h3>
                                    <button 
                                        onClick={() => {
                                            if(confirm("¿Estás seguro de que quieres borrar TODOS los registros? Esta acción no se puede deshacer.")){
                                                localStorage.clear();
                                                location.reload();
                                            }
                                        }}
                                        className="w-full flex items-center justify-between p-4 card-inner border-rose-500/20 text-rose-500 ios-btn-active"
                                    >
                                        <div className="flex items-center gap-3">
                                            <i data-lucide="trash-2" className="w-5 h-5"></i>
                                            <span className="font-bold text-sm">Borrar todos los datos</span>
                                        </div>
                                    </button>
                                </section>
                                
                                <div className="text-center py-4">
                                    <p className="text-[10px] text-slate-600 uppercase font-black tracking-widest">HorasPro Elite v3.0.0</p>
                                    <p className="text-[10px] text-slate-700 mt-1">Diseñado para iOS · Funcionamiento Offline</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navbar estilo iPhone */}
                    <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/5 px-8 pt-4 pb-safe flex justify-between items-center z-50">
                        <button onClick={() => setView('day')} className={`flex flex-col items-center gap-1.5 transition-all ${view === 'day' ? 'text-cyan-400 scale-110' : 'text-slate-600'}`}>
                            <i data-lucide="calendar-days" className="w-6 h-6"></i>
                            <span className="text-[9px] font-black uppercase tracking-tighter">Hoy</span>
                        </button>
                        <button onClick={() => setView('history')} className={`flex flex-col items-center gap-1.5 transition-all ${view === 'history' ? 'text-cyan-400 scale-110' : 'text-slate-600'}`}>
                            <i data-lucide="history" className="w-6 h-6"></i>
                            <span className="text-[9px] font-black uppercase tracking-tighter">Historial</span>
                        </button>
                        <button onClick={() => setView('settings')} className={`flex flex-col items-center gap-1.5 transition-all ${view === 'settings' ? 'text-cyan-400 scale-110' : 'text-slate-600'}`}>
                            <i data-lucide="database" className="w-6 h-6"></i>
                            <span className="text-[9px] font-black uppercase tracking-tighter">Backup</span>
                        </button>
                    </nav>

                    {toast && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 px-8 py-3 glass rounded-full border-cyan-500/30 text-white font-bold text-xs shadow-2xl animate-in fade-in zoom-in duration-300 z-[100] flex items-center gap-3">
                            <div className="w-2 h-2 bg-cyan-500 rounded-full animate-pulse"></div>
                            {toast}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
